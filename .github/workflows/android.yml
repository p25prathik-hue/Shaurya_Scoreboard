name: Android APK

on:
  push:
    branches: [main]
    paths:
      - 'www/**'
      - 'resources/**'
      - 'scripts/patch_android.py'
      - 'capacitor.config.json'
      - 'package.json'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install Capacitor
        run: npm install --no-audit --no-fund

      - name: Create Android project
        run: npx cap add android

      - name: Signing key (optional)
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        run: echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/release.keystore

      - name: Customise Android project (deep link, icons, splash, version)
        run: |
          python3 -m pip install --quiet --break-system-packages pillow || python3 -m pip install --quiet pillow
          python3 scripts/patch_android.py

      - name: Sync web app into Android project
        run: npx cap sync android

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          if [ -f app/release.keystore ] && [ -n "$ANDROID_KEYSTORE_PASSWORD" ]; then
            ./gradlew --no-daemon assembleRelease
            cp app/build/outputs/apk/release/app-release.apk ../ShauryaLive.apk
          else
            ./gradlew --no-daemon assembleDebug
            cp app/build/outputs/apk/debug/app-debug.apk ../ShauryaLive.apk
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ShauryaLive-apk
          path: ShauryaLive.apk

      - name: Publish to the "android-latest" release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete android-latest --yes --cleanup-tag || true
          gh release create android-latest ShauryaLive.apk \
            --title "Shaurya Live — Android app (build ${{ github.run_number }})" \
            --notes "Download **ShauryaLive.apk** below on your Android phone and open it to install (allow installs from your browser when asked). Built from ${{ github.sha }}." \
            --latest
